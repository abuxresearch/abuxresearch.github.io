<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Choose a Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { color: #fff; background: #000; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .website-selector { display: flex; min-height: 100vh; min-height: 100svh; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; padding: 2rem; }
    .study-instructions { max-width: 720px; margin: 0; color: #fff; font-size: clamp(1rem, 1.7vw, 1.2rem); line-height: 1.6; text-align: center; }
    .website-selector-buttons { display: flex; align-items: center; justify-content: center; gap: 1rem; }
    .website-selector-button { display: inline-flex; min-width: 150px; min-height: 54px; align-items: center; justify-content: center; padding: .85rem 1.4rem; border: 1px solid #6337ed; border-radius: 999px; color: #fff; background: #6337ed; font: inherit; font-size: 1rem; font-weight: 500; text-decoration: none; transition: background .2s ease, border-color .2s ease, transform .2s ease; }
    .website-selector-button:hover { transform: translateY(-2px); border-color: #bd49d4; background: #7138e9; }
    .website-selector-button:focus-visible { outline: 3px solid #bd49d4; outline-offset: 4px; }
    @media (max-width: 560px) {
      .website-selector-buttons { flex-direction: column; width: min(100%, 280px); }
      .website-selector-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="website-selector" aria-label="Choose a Nexa website">
    <p class="study-instructions">Welcome, we will begin the study shortly. Please wait for instructions from the Researcher before interacting with anything on the screen.</p>
    <nav class="website-selector-buttons" aria-label="Websites">
      <a class="website-selector-button" href="nexahome.html">Website A</a>
      <a class="website-selector-button" href="websiteb.html">Website B</a>
      <a class="website-selector-button" href="websitec.html">Website C</a>
    </nav>
  </main>
</body>
</html>
